[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
# The import name and the command are both `aura`; the distribution is
# `auralang` because `aura` is unlikely to be free on PyPI.
name = "auralang"
dynamic = ["version"]
description = "A small interpreted language with deliberately terrible keywords"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vijay Biradar" }]
keywords = ["language", "interpreter", "toy-language", "repl", "parser"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Education",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/iam-kira/what-did-i-do"
Source = "https://github.com/iam-kira/what-did-i-do"
Issues = "https://github.com/iam-kira/what-did-i-do/issues"

[project.scripts]
aura = "aura:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
py-modules = ["aura"]

[tool.setuptools.dynamic]
# read from aura.__version__, so the REPL banner and the release agree
version = { attr = "aura.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
